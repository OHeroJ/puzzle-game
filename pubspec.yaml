name: puzzle
description: A puzzle game built with Flutter.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.15.1
  firebase_analytics: ^11.5.2
  firebase_crashlytics: ^4.3.9

  # Supabase
  supabase_flutter: ^2.5.0

  # State management
  provider: ^6.1.2

  # UI
  flutter_screenutil: ^5.9.3
  go_router: ^16.0.0
  awesome_dialog: ^3.2.1
  lottie: ^3.3.1
  google_fonts: ^6.2.1
  cherry_toast: ^1.13.0
  package_info_plus: ^8.1.1

  # Networking
  dio: ^5.4.3+1
  http: ^1.1.0
  connectivity_plus: ^6.0.3

  # Storage
  shared_preferences: ^2.2.3
  flutter_cache_manager: ^3.3.2

  # Audio
  flame: ^1.30.1
  flame_audio: ^2.10.2

  # Utilities
  logging: ^1.2.0
  url_launcher: ^6.3.0
  file: ^7.0.0
  infinite_scroll_pagination: ^5.1.0
  cached_network_image: ^3.3.1

  # Icons
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  mockito: ^5.4.4
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/lottie/
    - assets/music/